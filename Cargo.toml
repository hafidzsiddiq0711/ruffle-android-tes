[package]
# Underscore because the cargo-ndk gradle plugin doesn't transform a hyphen to it.
name = "ruffle_android"
version = "0.1.0"
authors = [
    "Ruffle contributors <ruffle@ruffle.rs>",
    "TÖRÖK Attila <torokati44@gmail.com>",
    "Nathan Adams <dinnerbone@dinnerbone.com>",
]
edition = "2018"
resolver = "2"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = "symbols"

[dependencies]

android-activity = { version = "0.6.1", features = ["game-activity"] }
android_logger = "0.15.1"

jni = "0.22.4"
# reqwest (via ruffle_frontend_utils' `rustls-tls`) verifies certificates with this,
# which on Android needs to be initialized, and its Kotlin component included.
# Keep it semver-compatible with the version reqwest uses, so they share a copy.
rustls-platform-verifier = "0.7.1"
# ruffle_frontend_utils' `rustls-tls` doesn't include a crypto provider for reqwest,
# so we have to install one. Using `ring`, because `aws-lc-rs` needs CMake to build.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ndk = { version = "0.9.0", features = ["audio"] }

# Have to follow Ruffle with this.
wgpu = "30.0.1"

ruffle_common = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master", features = [
    "audio",
    "symphonia",
    "mp3",
    "nellymoser",
    "lzma",
    "default_compatibility_rules",
    "default_font",
] }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_video_software = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_frontend_utils = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master", default-features = false, features = ["fs", "navigator", "rustls-tls"] }

log = "0.4.32"

# Redirect tracing to log
tracing = {version = "0.1.44", features = ["log", "log-always"]}
backtrace = "0.3.76"
async-task = "4.7.1"

url = "2.5.2"
# Skua bridge (PoC) wire format.
serde_json = "1.0"
webbrowser = "1.2.4"

tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"]}

[features]
jpegxr = ["ruffle_core/jpegxr"]

# Skua PoC: use a local Ruffle checkout (same commit as Cargo.lock) with ruffle-patches/*.patch applied.
# CI clones it to ../ruffle-src; all Ruffle crates must point there so they stay one set of types.
[patch."https://github.com/ruffle-rs/ruffle.git"]
asc = { path = "../ruffle-src/tools/asc" }
build_playerglobal = { path = "../ruffle-src/core/build_playerglobal" }
flv-rs = { path = "../ruffle-src/flv" }
naga-agal = { path = "../ruffle-src/render/naga-agal" }
naga-pixelbender = { path = "../ruffle-src/render/naga-pixelbender" }
pixel_bender = { path = "../ruffle-src/render/pixel_bender" }
ruffle_common = { path = "../ruffle-src/core/common" }
ruffle_core = { path = "../ruffle-src/core" }
ruffle_frontend_utils = { path = "../ruffle-src/frontend-utils" }
ruffle_macros = { path = "../ruffle-src/core/macros" }
ruffle_render = { path = "../ruffle-src/render" }
ruffle_render_wgpu = { path = "../ruffle-src/render/wgpu" }
ruffle_video = { path = "../ruffle-src/video" }
ruffle_video_software = { path = "../ruffle-src/video/software" }
ruffle_wstr = { path = "../ruffle-src/wstr" }
swf = { path = "../ruffle-src/swf" }
